[project]
name = "laika"
version = "0.1.0"
description = "Um RAG baseado na bibliografia do curso técnico em informática do IFRN campus Ceará-Mirim."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "openai>=3.14.0",
    "pgvector>=0.5.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [
    ".venv",
    "**/__pycache__",
    ".git"
]
allowedUntypedLibraries = ["sentence_transformers", "torch", "transformers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
